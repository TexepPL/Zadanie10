<!DOCTYPE html>
<html lang="pl">
    <head>
        <meta charset="UTF-8">
        <title>ZadanieL10</title>
        <link rel="stylesheet" href="style.css" type="text/css" >
        <!-- JG -->
    </head>
    <body>
       <table id="table1" border="1">
           <tr>
               <th class="bluer" colspan="6">Tabela 1</th>
           </tr>
           <tr class="blue">
               <th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th>
           </tr>
           <tr>
               <th class="blue">2</th><td>a</td><td class="green">b</td><td class="green">c</td><td>d</td><td>e</td>
           </tr>
           <tr>
               <th class="blue">3</th><td>f</td><td>g</td><td>h</td><td>i</td><td class="green">j</td>
           </tr>
           <tr>
               <th class="blue">4</th><td>k</td><td>l</td><td>m</td><td>n</td><td class="green">o</td>
           </tr>
           <tr>
               <th class="blue">5</th><td class="green">p</td><td class="green">q</td><td class="green">r</td><td>s</td><td>t</td>
           </tr>
           <tr>
               <th class="blue">6</th><td class="green">u</td><td class="green">v</td><td class="green">w</td><td>y</td><td>z</td>
           </tr>
       </table>
       <table id="table2" border="1">
           <tr>
               <th class="bluer" colspan="6">Tabela 2</th>
           </tr>
           <tr class="blue">
               <th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th>
           </tr>
           <tr>
               <th class="blue">2</th><td>a</td><td class="green" colspan="2">b,c</td><td>d</td><td>e</td>
           </tr>
           <tr>
               <th class="blue">3</th><td>f</td><td>g</td><td>h</td><td>i</td><td class="green" rowspan="2">j,o</td>
           </tr>
           <tr>
               <th class="blue">4</th><td>k</td><td>l</td><td>m</td><td>n</td>
           </tr>
           <tr>
               <th class="blue">5</th><td class="green" colspan="3" rowspan="2">p,q,r,u,v,w</td><td>s</td><td>t</td>
           </tr>
           <tr>
               <th class="blue">6</th><td>y</td><td>z</td>
           </tr>
       </table>
        <table id="table3" border="1">
            <tr>
                <th class="bluer" colspan="6">Tabela 3</th>
            </tr>
            <tr class="blue">
                <th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th>
            </tr>
            <tr>
                <th class="blue">2</th><td>a</td><td>b</td><td>c</td><td>d</td><td>e</td>
            </tr>
            <tr>
                <th class="blue">3</th><td>f</td><td class="green" colspan="4">g,h,i,j</td>
            </tr>
            <tr>
                <th class="blue">4</th><td>k</td><td>l</td><td>m</td><td>n</td><td>o</td>
            </tr>
            <tr>
                <th class="blue">5</th><td>p</td><td>q</td><td>r</td><td>s</td><td>t</td>
            </tr>
            <tr>
                <th class="blue">6</th><td>u</td><td>v</td><td>w</td><td>y</td><td>z</td>
            </tr>
        </table>

</html>
